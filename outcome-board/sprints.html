<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprints</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  </head>
  <body class="sprints-page">
    <header class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Filter notes"
        aria-label="Filter notes"
      />
      <select id="who" aria-label="Show what someone is on">
        <option value="">Anyone</option>
      </select>
      <span
        id="statusMenu"
        data-hide="Dropped,Tabled,Paused,Done,Archived"
      ></span>
      <span class="type-chips">
        <button
          type="button"
          class="type-chip"
          data-listview="nested"
          aria-pressed="true"
          title="Each list shows its cards, with what's under them"
        >
          Nested
        </button>
        <button
          type="button"
          class="type-chip"
          data-listview="flat"
          aria-pressed="false"
          title="Each list shows everything under it that the filters let through, each on its own"
        >
          Flat
        </button>
      </span>
      <button id="expandAll" type="button">Expand all</button>
      <button id="collapseAll" type="button">Collapse all</button>
      <button id="archiveDone" type="button">Archive all done</button>
      <span id="archiveConfirm" class="archive-confirm" hidden></span>
      <label class="toggle"
        ><input id="showCompleted" type="checkbox" /> Show completed</label
      >
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </header>
    <main id="board" class="board" tabindex="-1"></main>
    <aside id="pane" class="pane" hidden></aside>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="mock.js"></script>
    <script type="module" src="sprints.js"></script>
    <!-- sprints.html?test runs the tests (see test.js) -->
    <script type="module">
      if (new URLSearchParams(location.search).has("test")) import("./test.js");
    </script>
  </body>
</html>
